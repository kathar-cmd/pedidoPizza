<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entregable momento 2</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <h1>Pedidos de Pizza</h1>
    <form action="">
        <label for="">Seleccione la pizza</label>
        <select name="" id="pizzas">
            <option value="14000">Queso $14.000</option>
            <option value="16000">Jamon $16.000</option>
            <option value="20000">Especial $20.000</option>
        </select>

        <br><br>
        <label for="">¿Cuántas pizzas desea comprar?</label>
        <input type="number" name="" id="cantidad" placeholder="Ingrese la cantidad" required>
        <br><br>

        <label for="">Ingredientes extra (opcional)</label>

        <br><br>

        <label for="maiz">Maiz $2.000</label>
        <select name="" id="maiz">
            <option value="0">No</option>
            <option value="2000">Si</option>
        </select>

        <br><br>

        <label for="queso_extra">Queso extra $10.000</label>
        <select name="" id="queso_extra">
            <option value="0">No</option>
            <option value="10000">Si</option>
        </select>

        <br><br>

        <label for="tocineta">Tocineta $5.000</label>
        <select name="" id="tocineta">
            <option value="0">No</option>
            <option value="5000">Si</option>
        </select>

        <br><br>

        <label for="champiñones">Champiñones $4.000</label>
        <select name="" id="champiñones">
            <option value="0">No</option>
            <option value="4000">Si</option>
        </select>

        <br><br>

        <input type="button" value="Calcular el total a pagar" onclick="calcular()">
    </form>
    <br><br>
    <p id="total"></p>

    <script src="dom.js"></script>

</body>
</html>
